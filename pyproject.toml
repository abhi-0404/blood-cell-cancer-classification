[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blood-cell-cancer-classification"
version = "0.1.0"
description = "Blood cell cancer image classification with CNN and EfficientNetB3."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "PyYAML>=6.0",
    "streamlit>=1.33",
]

[tool.setuptools.packages.find]
where = ["src"]
